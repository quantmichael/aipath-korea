[policy]
verification_threshold = 0.75
publish_threshold = 0.85
dedup_similarity_threshold = 0.88
max_retries = 3
collection_timeout_seconds = 20
max_response_bytes = 5242880
max_redirects = 3
retry_backoff_seconds = 0.25
raw_retention_days = 90
raw_storage_provider = "local"
raw_storage_bucket = "agent-raw"
processing_version = "conference-processing-v1"
processing_max_jobs_per_run = 1
processing_lease_seconds = 300
processing_retry_backoff_minutes = [15, 60, 360]
processing_max_attempts = 4
publish_max_jobs_per_run = 1
publish_lease_seconds = 300
automation_lease_seconds = 3600
user_agent = "AIPATH-AgentCollect/0.1 (+https://aipath.kr)"
llm_model = ""
discovery_promotion_threshold = 0.90
discovery_auto_approval_scopes_json = "[]"
discovery_search_provider = ""
discovery_official_domain_hints = []
discovery_max_results = 5
discovery_request_timeout_seconds = 10
discovery_daily_search_limit = 30
discovery_monthly_search_limit = 1000
discovery_query_cooldown_hours = 24
discovery_budget_timezone = "Asia/Seoul"
discovery_monthly_warning_threshold = 800
discovery_monthly_critical_threshold = 950
discovery_default_interval_minutes = 1440
discovery_max_jobs_per_run = 1
discovery_lease_seconds = 120
discovery_failure_backoff_minutes = [60, 360, 1440]
discovery_budget_delay_minutes = 1440
extraction_daily_llm_limit = 5
extraction_monthly_llm_limit = 100
extraction_max_retries = 1
extraction_max_input_chars = 12000
extraction_max_evidence_chars = 240
extraction_max_output_tokens = 1600
extraction_timeout_seconds = 30
extraction_budget_timezone = "Asia/Seoul"
extraction_model = "gpt-5.4-nano"
collection_default_interval_minutes = 720
collection_lease_seconds = 1800
collection_max_jobs_per_run = 5
collection_max_concurrent_jobs = 1
collection_max_concurrent_per_domain = 1
collection_failure_backoff_minutes = [30, 120, 360, 1440]
collection_failure_review_threshold = 4

[features]
discovery_enabled = false
discovery_auto_approval_enabled = false
llm_enabled = false
publish_enabled = false
automation_enabled = false
discovery_worker_enabled = false
ai_discovery_planner_enabled = false
ai_discovery_execution_enabled = false
collection_worker_enabled = false
processing_worker_enabled = false
publish_worker_enabled = false

# APP_ENV must explicitly be "development" to select the larger defaults.
# Missing, production, or unknown values use the production-safe profile.
[extraction_budget_profiles.development]
daily_llm_limit = 20
monthly_llm_limit = 300

[extraction_budget_profiles.production]
daily_llm_limit = 5
monthly_llm_limit = 100
